[platformio]
default_envs = seeed_xiao_nrf52840_sense
core_dir = .pio-core

[env:seeed_xiao_nrf52840_sense]
platform = https://github.com/Seeed-Studio/platform-seeedboards.git
board = seeed-xiao-afruitnrf52-nrf52840
framework = arduino
monitor_speed = 115200
; Route the official IMU library to the Sense's internal Wire1 bus.
build_flags = -DTARGET_SEEED_XIAO_NRF52840_SENSE

; Explicit opt-in, bounded first-write artifact. Never the default environment.
[env:tcb3_first_write]
extends = env:seeed_xiao_nrf52840_sense
build_flags =
    ${env:seeed_xiao_nrf52840_sense.build_flags}
    -DTACTICPOD_TCB3_FLASH_ENABLED=1
    -DTACTICPOD_TCB3_TEST_BUILD=1

; Phase 3B.8 profile 2: append after the preserved first session; no erases.
[env:tcb3_append_30s]
extends = env:seeed_xiao_nrf52840_sense
build_flags =
    ${env:seeed_xiao_nrf52840_sense.build_flags}
    -DTACTICPOD_TCB3_FLASH_ENABLED=1
    -DTACTICPOD_TCB3_TEST_BUILD=2

; Phase 3B.10: two-minute movement trial, exact append after both old sessions.
[env:tcb3_movement_120s]
extends = env:seeed_xiao_nrf52840_sense
build_flags =
    ${env:seeed_xiao_nrf52840_sense.build_flags}
    -DTACTICPOD_TCB3_FLASH_ENABLED=1
    -DTACTICPOD_TCB3_TEST_BUILD=3

; Separate reviewed prototype: reusable bounded sessions; battery absent/unarmed.
[env:tacticpod_reusable_usb]
extends = env:seeed_xiao_nrf52840_sense
; Project-owned initVariant correction; vendor core/default build untouched.
board_build.variants_dir = variants/tacticpod
build_flags =
    ${env:seeed_xiao_nrf52840_sense.build_flags}
    -DTACTICPOD_TCB3_FLASH_ENABLED=1
    -DTACTICPOD_REUSABLE=1

; BLE is lazy and mutually exclusive with recording; never enabled in the default/USB builds.
[env:tacticpod_reusable_ble]
extends = env:tacticpod_reusable_usb
build_flags =
    ${env:tacticpod_reusable_usb.build_flags}
    -DTACTICPOD_BLE=1
    -Wl,-T,linker/ble_reset.ld
    -Wl,-T,nrf52840_s140_v7.ld
    -Wl,-Map,$BUILD_DIR/firmware.map
